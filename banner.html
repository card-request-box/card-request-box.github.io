<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>配布バナー作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff7ef;color:#333;font-family:"Noto Sans JP",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
#cv{width:100%;height:auto;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:block;background:#eee}
.box{background:#fff;border-radius:12px;padding:14px;margin-top:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
label:first-child{margin-top:0}
input[type=text],input[type=number]{width:100%;font-size:16px;padding:10px;border:1px solid #ccc;border-radius:8px}
input[type=range]{width:100%}
.file{display:block;text-align:center;background:#ff5f6d;color:#fff;font-weight:900;font-size:17px;padding:14px;border-radius:10px;cursor:pointer}
.file input{display:none}
.btn{display:block;width:100%;border:0;background:#2aa84a;color:#fff;font-weight:900;font-size:17px;padding:14px;border-radius:10px;margin-top:12px;cursor:pointer;font-family:inherit}
.btn.sub{background:#888;font-size:14px;padding:10px}
.note{font-size:13px;color:#666;line-height:1.6;margin:8px 0 0}
#result{display:none;margin-top:14px}
#result img{width:100%;border-radius:10px;border:3px solid #2aa84a}
.row{display:flex;gap:10px}.row>div{flex:1}
</style>
</head><body>
<div class="wrap">
<h1>配布バナー作成</h1>
<canvas id="cv" width="1200" height="675"></canvas>

<div class="box">
  <label class="file">カード画像を選ぶ<input type="file" id="file" accept="image/*"></label>
  <div id="adj" style="display:none">
    <label>大きさ</label><input type="range" id="zoom" min="100" max="200" value="100">
    <div class="row">
      <div><label>左右の位置</label><input type="range" id="px" min="-100" max="100" value="0"></div>
      <div><label>上下の位置</label><input type="range" id="py" min="-100" max="100" value="0"></div>
    </div>
    <button class="btn sub" id="reset">位置を元に戻す</button>
  </div>
</div>

<div class="box">
  <label>カード名</label><input type="text" id="name" value="モノマネむすめ">
  <div class="row">
    <div><label>当選人数</label><input type="number" id="num" value="1" min="1" max="999"></div>
    <div><label>抽選日時</label><input type="text" id="date" value="10/13(火) 22:00"></div>
  </div>
</div>

<button class="btn" id="save">画像を保存する</button>
<p class="note">保存できないときは、下に出る画像を長押しして「写真に保存」を選んでください。</p>
<div id="result"><img id="out" alt="できあがった画像"></div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const F='"Noto Sans JP","Noto Sans CJK JP",sans-serif';
const FR={x:686,y:67,w:388,h:540,r:14};
const base=new Image();base.src='img/banner-base.png?v=1';
let card=null;
const $=id=>document.getElementById(id);

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fit(text,size,max){ctx.font=`900 ${size}px ${F}`;while(ctx.measureText(text).width>max&&size>16){size-=2;ctx.font=`900 ${size}px ${F}`;}return size;}

function draw(){
  ctx.clearRect(0,0,1200,675);
  if(base.complete&&base.naturalWidth)ctx.drawImage(base,0,0,1200,675);

  // カード枠
  ctx.save();rr(FR.x,FR.y,FR.w,FR.h,FR.r);
  if(card){
    ctx.clip();
    const z=$('zoom').value/100;
    const s=Math.max(FR.w/card.width,FR.h/card.height)*z;
    const w=card.width*s,h=card.height*s;
    const mx=(w-FR.w)/2,my=(h-FR.h)/2;
    const x=FR.x-mx+mx*($('px').value/100);
    const y=FR.y-my+my*($('py').value/100);
    ctx.drawImage(card,x,y,w,h);
  }else{
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();
    ctx.setLineDash([14,10]);ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.stroke();
    ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font=`900 28px ${F}`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;
    ['ここに','カード画像が','入ります'].forEach((t,i)=>ctx.fillText(t,FR.x+FR.w/2,FR.y+FR.h/2+(i-1)*42));
  }
  ctx.restore();

  // カード名
  const name=$('name').value.trim()||'カード名';
  const ns=fit(name,50,360);
  const tw=ctx.measureText(name).width;
  const bw=tw+64,bx=44,by=343,bh=88;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowOffsetY=6;
  rr(bx,by,bw,bh,14);const g=ctx.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,'#2aa84a');g.addColorStop(1,'#1f8f9a');
  ctx.fillStyle='#fff';ctx.fill();ctx.shadowColor='transparent';
  rr(bx+4,by+4,bw-8,bh-8,11);ctx.fillStyle=g;ctx.fill();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 ${ns}px ${F}`;
  ctx.fillText(name,bx+bw/2,by+bh/2+2);
  ctx.restore();

  // 当選人数バッジ
  const n=String($('num').value||'1');
  ctx.save();ctx.translate(570,400);ctx.rotate(-10*Math.PI/180);
  ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=16;ctx.shadowOffsetY=8;
  ctx.beginPath();ctx.arc(0,0,100,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.shadowColor='transparent';
  const rg=ctx.createRadialGradient(-30,-35,5,0,0,94);rg.addColorStop(0,'#fff3a0');rg.addColorStop(.55,'#ffc400');rg.addColorStop(1,'#e08a00');
  ctx.beginPath();ctx.arc(0,0,94,0,Math.PI*2);ctx.fillStyle=rg;ctx.fill();
  ctx.fillStyle='#b3200f';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`900 28px ${F}`;ctx.fillText('抽選で',0,-50);
  const s2=fit(n,70,150);ctx.fillText(n,0,2);
  ctx.font=`900 30px ${F}`;ctx.fillText('名様',0,54);
  ctx.restore();

  // 抽選日時
  ctx.save();ctx.fillStyle='#e0303c';ctx.textAlign='left';ctx.textBaseline='middle';
  fit($('date').value,44,560);ctx.fillText($('date').value,44,592);ctx.restore();
}

$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{card=im;$('adj').style.display='block';resetPos();};im.src=r.result;};
  r.readAsDataURL(f);
});
function resetPos(){$('zoom').value=100;$('px').value=0;$('py').value=0;draw();}
$('reset').addEventListener('click',resetPos);
['zoom','px','py','name','num','date'].forEach(id=>$(id).addEventListener('input',draw));

$('save').addEventListener('click',()=>{
  draw();
  const url=cv.toDataURL('image/png');
  $('out').src=url;$('result').style.display='block';
  const a=document.createElement('a');a.href=url;a.download='配布バナー.png';document.body.appendChild(a);a.click();a.remove();
});

base.onload=draw;
(document.fonts?document.fonts.load(`900 50px "Noto Sans JP"`):Promise.resolve()).then(draw,draw);
draw();
</script>
</body></html>
