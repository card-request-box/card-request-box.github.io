<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>そすのポイントカード</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="そすのポイントカード">
<meta property="og:description" content="あなたのスタンプの数とルーレット券を確認できます">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
:root{--sky-top:#0E1633;--sky-bottom:#25346A;--line:#2F3B66;--ink:#EEF1FA;--muted:#A3ADC6;--gold:#F2C14E;--star:#FFF4C8;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Meiryo",sans-serif;color-scheme:dark}
html{background:var(--sky-bottom)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom));color:var(--ink);font-family:var(--font);
  display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.card{width:100%;max-width:560px;position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);
  background:linear-gradient(160deg,var(--sky-top),var(--sky-bottom));padding:24px 22px 18px;box-sizing:border-box;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--star);opacity:.7}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.title{font-size:clamp(18px,5.2vw,24px);font-weight:800;letter-spacing:.03em;line-height:1.3}
.title small{display:block;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.2em;margin-bottom:4px}
.no{flex:none;font-size:17px;font-weight:800;color:#18213D;background:var(--gold);padding:6px 16px;border-radius:999px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:26px}
.slot{aspect-ratio:1;max-width:100%;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;background:rgba(255,255,255,.05)}
.slot.on{border:3px solid var(--gold);background:rgba(242,193,78,.14);animation:pop .4s ease-out both}
.slot svg{width:60%;height:60%}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.slot.on{animation:none}}
.foot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:24px}
.box{background:rgba(16,25,58,.6);border:1px solid var(--line);border-radius:14px;padding:10px 10px;min-width:0}
.box span{display:block;font-size:11px;color:var(--muted)}
.box b{display:block;font-size:clamp(15px,4.4vw,19px);font-weight:800;color:var(--star);white-space:nowrap;font-variant-numeric:tabular-nums}
.box.t b{color:var(--gold)}
.note{margin-top:16px;font-size:11px;color:var(--muted);text-align:right;line-height:1.6}
.err{text-align:center;line-height:1.8;color:var(--muted);padding:30px 6px}
.err b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="stars" id="stars"></div>
  <div class="head">
    <div class="title"><small>ポイントカード</small>そすのポイントカード</div>
    <div class="no" id="no">No.-</div>
  </div>
  <div id="body"></div>
</main>
<script>
// リンクの形: pointcard.html#n=番号&s=合計スタンプ&c=繰り越し円&t=ルーレット券&d=更新日&k=確認用
const PER=500, GOAL=5;
function sig(n,s,c,t,d){const str=[n,s,c,t,d,"sosu-pc"].join("|");let h=5381;for(let i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))>>>0}return h.toString(36)}
const paw='<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#F2C14E"><ellipse cx="50" cy="66" rx="22" ry="19"/><ellipse cx="24" cy="40" rx="9" ry="12" transform="rotate(-20 24 40)"/><ellipse cx="41" cy="26" rx="9" ry="12" transform="rotate(-6 41 26)"/><ellipse cx="59" cy="26" rx="9" ry="12" transform="rotate(6 59 26)"/><ellipse cx="76" cy="40" rx="9" ry="12" transform="rotate(20 76 40)"/></g></svg>';
[[86,8],[92,22],[96,5],[78,4],[5,92],[12,88],[64,94],[95,85],[48,3]].forEach(([x,y])=>{const e=document.createElement("i");e.style.left=x+"%";e.style.top=y+"%";document.getElementById("stars").appendChild(e)});
const B=document.getElementById("body");
function bad(){B.innerHTML='<div class="err"><b>このリンクは読み取れませんでした</b>お手数ですが、最新のリンクをもう一度もらってください。</div>'}
try{
  const p=new URLSearchParams(location.hash.slice(1));
  const n=p.get("n"),s=p.get("s"),c=p.get("c"),t=p.get("t"),d=p.get("d")||"",k=p.get("k");
  const ok=[n,s,c,t].every(v=>v!==null&&/^\d+$/.test(v))&&k===sig(n,s,c,t,d);
  if(!ok){bad()}else{
    const S=+s,C=+c,T=+t;
    document.getElementById("no").textContent="No."+n;
    document.title="そすのポイントカード No."+n;
    const filled=S===0?0:((S-1)%GOAL)+1;
    let slots="";for(let i=0;i<GOAL;i++){slots+=i<filled?'<div class="slot on" style="animation-delay:'+(i*0.08)+'s">'+paw+'</div>':'<div class="slot"></div>'}
    B.innerHTML='<div class="row" aria-label="スタンプ '+filled+'／'+GOAL+'">'+slots+'</div>'+
      '<div class="foot"><div class="box"><span>合計スタンプ</span><b>'+S+'個</b></div>'+
      '<div class="box"><span>次のスタンプまで</span><b>あと'+(PER-C)+'円</b></div>'+
      '<div class="box t"><span>使えるルーレット券</span><b>'+T+'枚</b></div></div>'+
      '<div class="note">500円ごとにスタンプ1個 ・ 5個でルーレット1回<br>'+(d?d.replace(/[<>&"]/g,"")+' 更新':'')+'</div>';
  }
}catch(e){bad()}
</script>
</body>
</html>
