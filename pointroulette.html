<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>そすのポイントカード ルーレット</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="そすのポイントカード ルーレット">
<meta property="og:description" content="もらった合言葉を入れてルーレットを回してください">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
:root{--sky-top:#0E1633;--sky-bottom:#25346A;--panel:#151F42;--soft:#1D2850;--line:#2F3B66;--ink:#EEF1FA;--muted:#A3ADC6;
  --gold:#F2C14E;--gold-deep:#C9962A;--star:#FFF4C8;--error:#FF8A80;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Meiryo",sans-serif;color-scheme:dark}
html{background:var(--sky-bottom)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom));color:var(--ink);font-family:var(--font)}
.wrap{max-width:520px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(40px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1{margin:0;font-size:clamp(20px,6vw,26px);font-weight:800;text-wrap:balance}
h1 small{display:block;font-size:12px;color:var(--gold);letter-spacing:.2em;margin-bottom:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.lead{margin:0;font-size:14px;color:var(--muted);line-height:1.7}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:22px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;text-align:center;
  color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:var(--gold);color:#18213D}
button:disabled{opacity:.5;cursor:default}
.msg{font-size:14px;color:var(--error);min-height:1em;margin:0}
.wheel-wrap{position:relative;width:min(100%,400px);margin:4px auto 0;aspect-ratio:1}
.wheel-wrap svg{width:100%;height:100%;display:block;transition:transform 5.5s cubic-bezier(.12,.72,.08,1)}
.pointer{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--gold);filter:drop-shadow(0 3px 2px rgba(0,0,0,.4));z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:22%;height:22%;border-radius:50%;background:var(--panel);border:5px solid var(--gold);display:grid;place-items:center;z-index:1}
.hub svg{width:55%;height:55%}
.kind{text-align:center;font-weight:800;color:var(--gold);letter-spacing:.1em;margin:0}
.result{text-align:center;min-height:2.4em}
.result .big{font-size:26px;font-weight:800}
.result .big b{color:var(--gold)}
.result small{display:block;color:var(--muted);font-size:13px;margin-top:6px;line-height:1.6}
.odds{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center}
@media (prefers-reduced-motion:reduce){.wheel-wrap svg{transition-duration:.01s}}
</style>
</head>
<body>
<div class="wrap">
  <h1><small>ポイントカード</small>そすのルーレット</h1>
  <section class="panel">
    <p class="lead">もらった合言葉（7文字）を入れて「回す」を押してください。合言葉ごとに1回分の結果が決まっています。</p>
    <div class="row">
      <input id="code" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="合言葉" aria-label="合言葉">
      <button id="spin">回す</button>
    </div>
    <p class="msg" id="msg"></p>
  </section>
  <section class="panel" id="stage" hidden>
    <p class="kind" id="kind"></p>
    <div class="wheel-wrap">
      <div class="pointer" aria-hidden="true"></div>
      <svg id="wheel" viewBox="-110 -110 220 220" role="img" aria-label="ルーレット"></svg>
      <div class="hub" aria-hidden="true"><svg viewBox="0 0 100 100"><g fill="#F2C14E"><ellipse cx="50" cy="66" rx="22" ry="19"/><ellipse cx="24" cy="40" rx="9" ry="12" transform="rotate(-20 24 40)"/><ellipse cx="41" cy="26" rx="9" ry="12" transform="rotate(-6 41 26)"/><ellipse cx="59" cy="26" rx="9" ry="12" transform="rotate(6 59 26)"/><ellipse cx="76" cy="40" rx="9" ry="12" transform="rotate(20 76 40)"/></g></svg></div>
    </div>
    <div class="result" id="result" aria-live="polite"></div>
    <div class="odds" id="odds"></div>
  </section>
</div>
<script>
/* 管理ページと同じ計算。合言葉 = 種類1文字(W=値引き/C=カード) + 5文字 + 確認1文字 */
const ALPH="ABCDEFGHJKMNPQRSTUVWXYZ23456789", SALT="sosu-roulette-v1";
const TABLE={
  W:{name:"値引きルーレット",items:[["25円引き",60],["50円引き",20],["75円引き",10],["100円引き",5],["150円引き",5]]},
  C:{name:"カードプレゼントルーレット",items:[["新弾 虹",40],["新弾 黒",40],["新弾 トレーナー",20]]}
};
const COLORS=["#F2C14E","#3E6FB0","#D2557A","#2E8B57","#8A63C9","#E07A3F"];
function h32(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0}return h}
function valid(code){if(!/^[WC][A-Z2-9]{6}$/.test(code))return false;const body=code.slice(0,6);return ALPH[h32(body+"|"+SALT+"|chk")%ALPH.length]===code[6]}
function resultIndex(code){const t=TABLE[code[0]];let r=h32(code+"|"+SALT)%100;for(let i=0;i<t.items.length;i++){r-=t.items[i][1];if(r<0)return i}return t.items.length-1}

const $=id=>document.getElementById(id);let angle=0,spinning=false;
function draw(t){
  const svg=$("wheel"),ns="http://www.w3.org/2000/svg",R=100;svg.innerHTML="";let acc=0;
  t.items.forEach(([label,w],i)=>{
    const a0=acc/100*2*Math.PI-Math.PI/2;acc+=w;const a1=acc/100*2*Math.PI-Math.PI/2;
    const p=document.createElementNS(ns,"path");
    p.setAttribute("d",`M0,0 L${R*Math.cos(a0)},${R*Math.sin(a0)} A${R},${R} 0 ${a1-a0>Math.PI?1:0} 1 ${R*Math.cos(a1)},${R*Math.sin(a1)} Z`);
    p.setAttribute("fill",COLORS[i%COLORS.length]);p.setAttribute("stroke","#FBFAF5");p.setAttribute("stroke-width",.8);svg.appendChild(p);
    const mid=(a0+a1)/2,tr=R*0.66,x=tr*Math.cos(mid),y=tr*Math.sin(mid);
    const tx=document.createElementNS(ns,"text");
    tx.setAttribute("x",x);tx.setAttribute("y",y);tx.setAttribute("font-size",w<=5?7:w<=10?8.5:10);tx.setAttribute("font-weight",800);
    tx.setAttribute("fill",i===0?"#18213D":"#fff");tx.setAttribute("text-anchor","middle");tx.setAttribute("dominant-baseline","central");
    tx.setAttribute("font-family","M PLUS Rounded 1c, sans-serif");
    tx.setAttribute("transform",`rotate(${mid*180/Math.PI} ${x} ${y})`);tx.textContent=label;svg.appendChild(tx);
  });
  const ring=document.createElementNS(ns,"circle");ring.setAttribute("r",104);ring.setAttribute("fill","none");ring.setAttribute("stroke","#F2C14E");ring.setAttribute("stroke-width",6);svg.appendChild(ring);
  $("odds").textContent=t.items.map(([l,w])=>l+" "+w+"%").join("　");
}
function spinTo(t,idx){
  let acc=0;for(let i=0;i<idx;i++)acc+=t.items[i][1];const w=t.items[idx][1];
  const center=(acc+w/2)/100*360, jitter=(Math.random()-.5)*w/100*360*0.6;
  const target=((360-(center+jitter))%360+360)%360;
  angle=Math.ceil(angle/360)*360+360*6+target;
  $("wheel").style.transform=`rotate(${angle}deg)`;
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  return new Promise(r=>setTimeout(r,reduce?60:5700));
}
async function go(){
  if(spinning)return;
  const code=$("code").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");$("code").value=code;$("msg").textContent="";
  if(!valid(code)){$("msg").textContent="合言葉が違うようです。7文字をもう一度たしかめて入れてください。";return}
  const t=TABLE[code[0]],idx=resultIndex(code);
  spinning=true;$("spin").disabled=true;$("stage").hidden=false;$("kind").textContent=t.name;$("result").textContent="";
  const svg=$("wheel");svg.style.transition="none";angle=0;svg.style.transform="rotate(0deg)";draw(t);
  svg.getBoundingClientRect();svg.style.transition="";
  $("stage").scrollIntoView({behavior:"smooth",block:"start"});
  await spinTo(t,idx);
  $("result").innerHTML='<div class="big">結果：<b></b></div><small>この画面のスクリーンショットか、合言葉を送ってください。<br>合言葉 '+code+'</small>';
  $("result").querySelector("b").textContent=t.items[idx][0];
  spinning=false;$("spin").disabled=false;
}
$("spin").onclick=go;$("code").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
const pre=new URLSearchParams(location.hash.slice(1)).get("code");if(pre)$("code").value=pre.toUpperCase();
</script>
</body>
</html>
